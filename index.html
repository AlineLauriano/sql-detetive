<script src="https://cdn.jsdelivr.net/npm/sql.js@1.14.1/dist/sql-wasm.js"></script><script>
'use strict';
const SQL_WASM='https://cdn.jsdelivr.net/npm/sql.js@1.14.1/dist/sql-wasm.wasm';
const PASSWORD='SQL26';
const STEPS=['Abertura','1. Explore a base','2. Decifre SQL','3. Ciência e SQL','4. Jogo de consultas','5. Laboratório','6. O mistério','Encerramento'];
const DATA=[[101,'Ana','Santos',250,'Pendente'],[102,'Bruno','Registro',800,'Entregue'],[103,'Carla','Santos',750,'Pendente'],[104,'Diego','Campinas',920,'Pendente'],[105,'Elisa','Santos',610,'Entregue'],[106,'Fábio','Registro',420,'Pendente']];
const COLS=['id','cliente','cidade','valor','status'];
let current=0,done=new Set(),teacher=false,started=null,elapsed=0,clocktimer=null,view=false;
let m1sel=new Set(),m1msg='',m2Answer='',language='en',m3read=false,m3answer='',m3feedback='',gameRound=0,gameSelected=[],gameDone=[false,false,false],gameMsg='',gameViews=[null,null,null],labLevel=0,labText='',labResult=null,labHint=0,finalText='',finalResult=null,queryHistory=[],caseChoice='',caseMsg='',researchCitationShown=false;
let SQL=null,ready=false,loadError='';let authoredQuestion='',finalStage=0,finalStageA=false,finalStageB=false,finalHint=0,gameEverChecked=false;
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=s=>String(s).trim().toLowerCase();
function basicTable(rows,cols=COLS){return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${h(c.toUpperCase())}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${h(Array.isArray(r)?r[COLS.indexOf(c)]:r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function resultTable(cols,rows){return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${h(c)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${h(c)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length}">Nenhuma linha encontrada</td></tr>`}</tbody></table></div>`}
function feedback(msg,type=''){return `<div class="feedback ${type}">${msg}</div>`}
function timeString(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function clockUpdate(){const e=document.getElementById('clock');if(!e)return;e.textContent=started===null?'Aguardando início':timeString(Math.floor((Date.now()-started)/1000));document.getElementById('resetClock').hidden=started===null}
function beginClock(){if(started===null){started=Date.now();clocktimer=setInterval(clockUpdate,400);render()}}
function restartClock(){if(!confirm('Reiniciar a contagem do tempo da aula?'))return;started=Date.now();clockUpdate()}
function togglePresentation(){view=!view;document.getElementById('shell').classList.toggle('modepresentation',view)}
function progress(){document.getElementById('nav').innerHTML=STEPS.map((s,i)=>`<button ${!canGo(i)?'disabled title="Conclua as missões anteriores para avançar"':''} onclick="go(${i})" class="${current===i?'active ':''}${done.has(i)?'done':''}">${h(s)}</button>`).join('');document.getElementById('progressbar').style.width=Math.min(done.size,6)/6*100+'%';document.getElementById('progresslabel').textContent=done.size+' de 6 missões concluídas'}
function canGo(n){if(teacher)return true;if(n<=1)return true;for(let i=1;i<n;i++){if(!done.has(i))return false}return true}
function go(n){if(n<0||n>7||!canGo(n))return;current=n;render();scrollTo({top:0,behavior:'instant'})}
function teacherPanel(){if(!teacher||current===0)return '';const notes={1:'Retome o conceito de registro e coluna. Peça que justifiquem a escolha.',2:'Demonstre SELECT cliente, valor FROM pedidos; Explique o fluxo dos comandos.',3:'Resposta de referência: FROM identifica a tabela; WHERE restringe as linhas; SELECT define as colunas exibidas. A ordem lógica descrita no texto não altera a sintaxe escrita.',4:'Mostre por que cada cartão foi escolhido e por que os distratores não atendem ao pedido.',5:'Etapa A: SELECT cliente, status FROM pedidos; Etapa B: SELECT cliente, status FROM pedidos WHERE valor > 500;',6:"Etapa A: SELECT id, cliente, valor FROM pedidos WHERE cidade = 'Santos'; Etapa B: peça que o aluno explique a pergunta criada e verifique se a consulta realmente produz os dados necessários.",7:'Retome os resultados e a justificativa com evidências.'};return `<details class="teacher"><summary>🔓 Resolução da professora</summary><p>${h(notes[current]||'')}</p></details>`}
function render(){progress();const body=[home,m1,m2,m3,m4,m5,m6,end][current]();const disabledNext=!teacher && current>=1 && current<=6 && !done.has(current);document.getElementById('main').innerHTML=`<div class="row space"><span class="eyebrow">${current===0?'Preparação':current===7?'Síntese':`Missão ${current} de 6`}</span><span class="screeninfo">Tente individualmente · correção pelo Meet</span></div>${teacher?'<p class="teacher-session">🔓 Modo professora ativo · navegação liberada</p>':''}${teacherPanel()}${body}<div class="footer-nav"><button class="btn alt" ${current===0?'disabled':''} onclick="go(${current-1})">← Voltar</button>${current===7?'':`<div class="row">${disabledNext?'<span class="foot-hint">Conclua a atividade para continuar.</span>':''}<button class="btn" ${disabledNext?'disabled':''} onclick="go(${current+1})">${current===6?'Encerrar aula':'Continuar'} →</button></div>`}</div>`;clockUpdate()}
function home(){return `<div class="row space"><span class="eyebrow">Educação em Computação</span>${started===null?'<button class="btn" onclick="beginClock()">▶ Iniciar cronômetro</button>':''}</div><h1>SQL Detetive <span style="color:var(--mint)">— O mistério dos pedidos</span></h1><div class="card"><h3>Objetivo de aprendizagem</h3><p><strong>Taxonomia de Bloom: nível 4 — Analisar</strong></p><p><strong>Objetivo:</strong> ao final da aula, o estudante será capaz de analisar registros de um banco de dados por meio de consultas SQL básicas, utilizando <code>SELECT</code>, <code>FROM</code> e <code>WHERE</code> para selecionar e filtrar informações, construir consultas e interpretar resultados na investigação de um problema.</p></div><div class="card"><span class="eyebrow">Sua missão</span><h3>Aprenda a investigar dados</h3><p>Em seis sessões, você explorará registros, compreenderá como consultar uma tabela, praticará comandos SQL e, ao final, resolverá um caso com os conhecimentos adquiridos.</p><div class="row"><span class="chip">6 sessões</span><span class="chip">20–25 minutos</span><span class="chip">Prática individual + resolução coletiva</span></div></div><p class="sub small">Acompanhe a tela compartilhada pela professora e realize as atividades no seu próprio navegador.</p>`}
function m1(){return `<h2>Missão 1 · O que existe na base?</h2><p class="lead">Antes de consultar dados, vamos reconhecer como eles estão organizados.</p><div class="card"><h3>Conheça a tabela <code>pedidos</code></h3><p>Observe as colunas. Cada linha representa um pedido; cada coluna descreve uma característica desse pedido.</p><p>Como vimos na aula de chave primária, o campo <code>id</code> identifica cada pedido de forma única. Nesta tabela, ele é a <strong>chave primária</strong>.</p>${basicTable(DATA)}<div class="task"><h3>🔎 Exploração</h3><p>Quais colunas permitem descobrir onde a compra ocorreu, seu valor e a situação do pedido? Selecione as três colunas.</p></div><div class="row">${COLS.map(c=>`<button class="pill ${m1sel.has(c)?'selected':''}" onclick="toggleColumn('${c}')">${m1sel.has(c)?'✓ ':''}${c}</button>`).join('')}</div><div class="row" style="margin-top:15px"><button class="btn" onclick="checkM1()">Conferir escolha</button><button class="btn alt" onclick="m1sel.clear();m1msg='';done.delete(1);render()">↻ Tentar novamente</button></div>${m1msg}</div>`}
function toggleColumn(c){m1sel.has(c)?m1sel.delete(c):m1sel.add(c);m1msg='';render()}
function checkM1(){const wanted=['cidade','valor','status'];const wrong=[...m1sel].filter(c=>!wanted.includes(c));const missing=wanted.filter(c=>!m1sel.has(c));if(!wrong.length&&!missing.length){m1msg=feedback('Você encontrou as três características: cidade, valor e status.','ok');done.add(1)}else{m1msg=feedback(`Confira sua seleção. ${wrong.length?'Coluna(s) que não respondem ao pedido: '+wrong.map(h).join(', ')+'. ':''}${missing.length?`Ainda faltam ${missing.length} coluna(s) relacionada(s) às informações solicitadas.`:''}`,'bad')}render()}
function m2(){return `<h2>Missão 2 · Como conversar com os dados?</h2><div class="intro-sql"><h3>O que é SQL?</h3><p><strong>SQL</strong> (Structured Query Language, ou Linguagem de Consulta Estruturada) é uma linguagem usada para consultar e manipular dados em bancos de dados relacionais. Aqui vamos aprender a <strong>consultar</strong> informações, sem modificar os registros.</p></div><p class="lead">Três cláusulas nos ajudam a fazer uma consulta:</p><div class="sql-term"><h3>SELECT</h3><p><strong>O que quero visualizar?</strong> Indica quais colunas devem aparecer na resposta. Exemplo: <code>SELECT cliente, valor</code>.</p><div class="term-tip">Quando escolher mais de uma coluna, separe os nomes por vírgula. Use <code>SELECT *</code> para visualizar todas as colunas.</div></div><div class="sql-term"><h3>FROM</h3><p><strong>De qual tabela?</strong> Indica a tabela que contém os dados. Nesta aula: <code>FROM pedidos</code>.</p></div><div class="sql-term"><h3>WHERE</h3><p><strong>Quais registros atendem à condição?</strong> Filtra as linhas. Para um valor textual, use aspas simples: <code>WHERE cidade = 'Registro'</code>. Para um número, escreva sem aspas: <code>WHERE valor > 500</code>.</p><div class="term-tip"><code>WHERE</code> é opcional. Sem ele, a consulta pode mostrar todos os registros da tabela.</div></div><p class="stage-message"><strong>Finalização:</strong> o ponto e vírgula (<code>;</code>) indica o fim de uma <strong>instrução SQL</strong>, e não o fim de cada linha do código. Vamos usá-lo no final de nossas consultas, embora alguns ambientes executem uma instrução isolada sem ele.</p><div class="card"><h3>Veja tudo funcionando</h3><p>Para mostrar o nome e o valor dos pedidos realizados em Registro:</p><div class="panel-code"><b>SELECT</b> cliente, valor<br><b>FROM</b> pedidos<br><b>WHERE</b> cidade = 'Registro';</div><p>Essa consulta somente recupera informações. Não altera a tabela.</p></div><div class="card"><div class="task"><h3>🧠 Teste de compreensão</h3><p>Em <code>SELECT cliente, valor FROM pedidos WHERE cidade = 'Registro';</code>, qual cláusula decide <strong>quais linhas</strong> serão retornadas?</p></div><div class="row">${['SELECT','FROM','WHERE'].map(x=>`<button class="btn alt" onclick="m2Answer='${x}';if(m2Answer==='WHERE')done.add(2);render()">${x}</button>`).join('')}</div>${m2Answer?feedback(m2Answer==='WHERE'?'Correto! WHERE determina a condição que filtra as linhas.':`${m2Answer} tem outra função. Identifique onde aparece a condição cidade = 'Registro'.`,m2Answer==='WHERE'?'ok':'bad'):''}</div>`}
const PARAS_EN=["Structured Query Language (SQL) is the most common language used to extract and wrangle data contained in a relational database. SQL is an essential skill for anyone working in analytics.","There are three main clauses in a SQL query: (a) SELECT, (b) FROM, and (c) WHERE. The SELECT and FROM clauses are required, though the optional WHERE clause is frequently needed.","SELECT: Specifies the columns to include in the output","FROM: Specifies the table(s) in which the relevant data are contained","WHERE: Specifies the rows to search","Despite the clauses being ordered as shown above (SELECT then FROM then WHERE), the FROM clause is the first to execute since we first need to identify the relevant table(s) before filtering rows and selecting columns. The SELECT clause is the last to execute."];
const PARAS_PT=["A Linguagem de Consulta Estruturada (SQL) é a linguagem mais comum usada para extrair e organizar dados contidos em um banco de dados relacional. SQL é uma habilidade essencial para quem trabalha com análise de dados.","Há três cláusulas principais em uma consulta SQL: (a) SELECT, (b) FROM e (c) WHERE. As cláusulas SELECT e FROM são obrigatórias, enquanto WHERE é opcional, embora frequentemente necessária.","SELECT: especifica as colunas incluídas no resultado.","FROM: especifica a tabela ou as tabelas que contêm os dados relevantes.","WHERE: especifica as linhas a serem pesquisadas.","Apesar de as cláusulas serem escritas na ordem SELECT, FROM e WHERE, a cláusula FROM é considerada primeiro na explicação lógica do processamento: antes de filtrar linhas e selecionar colunas, é necessário identificar a tabela relevante. SELECT é considerada por último."];
function m3(){return `<h2>Missão 3 · O que diz uma publicação acadêmica?</h2><p class="lead">Vamos observar um detalhe novo: <strong>na explicação lógica, a ordem de processamento de uma consulta é diferente da ordem em que escrevemos as cláusulas.</strong></p><div class="article"><div class="eyebrow" style="color:#256775">Leitura acadêmica · acesso aberto</div><h3>Introduction to SQL</h3><div class="small">Craig Starbuck · <em>The Fundamentals of People Analytics</em> · Springer, 2023 · capítulo 3</div><div class="row" style="margin-top:14px"><button class="tab ${language==='en'?'':'off'}" onclick="language='en';render()">English · original</button><button class="tab ${language==='pt'?'':'off'}" onclick="language='pt';render()">Português · tradução</button></div><p class="small">${language==='en'?'Trecho do original em inglês, com atribuição à fonte (CC BY 4.0).':'Tradução para fins didáticos, apresentada separadamente do original.'}</p><blockquote>${(language==='en'?PARAS_EN:PARAS_PT).map(h).join('\n\n')}</blockquote><p class="small">Fonte: <a href="https://doi.org/10.1007/978-3-031-28674-2_3" target="_blank" rel="noopener noreferrer">Starbuck (2023) — capítulo original</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">Licença CC BY 4.0</a>.</p></div><div class="card"><div class="task"><h3>📚 Sua investigação</h3><p>Segundo a leitura, qual cláusula é considerada primeiro na explicação lógica de uma consulta SQL? Por quê?</p><p style="margin-top:12px"><strong>💬 Envie sua resposta pelo chat do Google Meet.</strong> Em seguida, acompanhe a resolução coletiva.</p></div><button class="btn alt" onclick="m3read=true;done.add(3);render()">✓ Já li e enviei minha resposta</button>${m3read?feedback('Pesquisa concluída! A professora retomará a explicação durante a correção.','ok'):''}</div>`}
const GAME=[{title:'Mostre somente as colunas cliente e valor da tabela pedidos.',answer:['SELECT cliente, valor','FROM pedidos'],cards:['FROM clientes','SELECT *','FROM pedidos','SELECT valor','SELECT cliente, valor','WHERE cidade = \'Santos\'']},{title:'Mostre todas as colunas da tabela pedidos com valor acima de R$ 500.',answer:['SELECT *','FROM pedidos','WHERE valor > 500'],cards:['WHERE cidade = \'Santos\'','FROM pedidos','SELECT valor','SELECT *','WHERE valor > 500','FROM clientes']},{title:'Mostre todas as colunas com status Pendente da tabela pedidos.',answer:['SELECT *','FROM pedidos',"WHERE status = 'Pendente'"],cards:['SELECT valor','FROM clientes','WHERE valor > 500','FROM pedidos',"WHERE status = 'Pendente'",'SELECT *']}];
function gameResult(){const task=GAME[gameRound],sel=gameSelected,required=task.answer;const wrong=sel.filter(x=>!required.includes(x)),missing=required.filter(x=>!sel.includes(x));const ordered=sel.length===required.length&&sel.every((s,i)=>s===required[i]);if(ordered){gameDone[gameRound]=true;if(gameDone.every(Boolean))done.add(4);gameMsg=feedback('Boa! A consulta está correta. Avance para a próxima rodada.','ok')}else{let msg=[];if(wrong.length)msg.push(`${wrong.length} bloco(s) não atendem ao desafio: ${wrong.map(x=>`<code>${h(x)}</code>`).join(', ')}.`);if(missing.length)msg.push(`Faltam ${missing.length} bloco(s) necessário(s).`);if(!wrong.length&&!missing.length)msg.push('Os blocos estão corretos, mas sua ordem precisa ser revista.');gameMsg=feedback(msg.join(' '),'bad')}render()}
function setGameRound(i){gameRound=i;gameSelected=gameViews[i]||[];gameMsg='';render()}
function addBlock(x){if(gameDone[gameRound])return;gameSelected.push(x);gameViews[gameRound]=[...gameSelected];gameMsg='';render()}
function removeBlock(i){if(gameDone[gameRound])return;gameSelected.splice(i,1);gameViews[gameRound]=[...gameSelected];gameMsg='';render()}
function m4(){const t=GAME[gameRound],complete=gameDone.every(Boolean);if(complete)return `<h2>Missão 4 · Jogo de consultas</h2><div class="bigcenter"><h2>Parabéns!</h2><p class="lead">Você concluiu as três rodadas e montou suas primeiras consultas. Na próxima missão, será sua vez de escrever o SQL.</p></div>`;return `<h2>Missão 4 · Jogo: monte as consultas</h2><p class="lead">Organize as cláusulas conforme o enunciado. Nem todos os cartões pertencem à resposta.</p><div class="card"><div class="row space"><h3>Rodada ${gameRound+1} de 3</h3><span class="chip">${gameDone.filter(Boolean).length}/3 concluídas</span></div><div class="task"><h3>🎮 Desafio da rodada</h3><p>${t.title}</p></div><div class="card" style="border-style:dashed;background:#0b2739"><span class="sub small">Sua consulta (clique × para remover):</span>${gameSelected.length?gameSelected.map((x,i)=>`<div class="row" style="margin:8px 0"><code>${h(x)}</code>${gameDone[gameRound]?'':`<button class="btn alt" style="padding:3px 10px" onclick="removeBlock(${i})">×</button>`}</div>`).join(''):'<p class="sub">Escolha os cartões abaixo na ordem desejada.</p>'}</div><div class="row">${t.cards.map(x=>`<button class="pill" ${gameDone[gameRound]||gameSelected.includes(x)?'disabled':''} onclick="addBlock(${JSON.stringify(x).replace(/"/g,'&quot;')})">${h(x)}</button>`).join('')}</div>${gameMsg}<div class="row" style="margin-top:16px"><button class="btn" ${gameDone[gameRound]?'disabled':''} onclick="gameResult()">Conferir consulta</button><button class="btn alt" ${gameDone[gameRound]?'disabled':''} onclick="gameSelected=[];gameViews[gameRound]=[];gameMsg='';render()">Limpar blocos</button><button class="btn alt" ${gameRound===0?'disabled':''} onclick="setGameRound(${gameRound-1})">← Rodada anterior</button>${gameRound<2&&gameDone[gameRound]?`<button class="btn next-round" onclick="setGameRound(${gameRound+1})">Próxima rodada →</button>`:''}</div></div>`}
function engineStatus(){return ready?'<span class="chip">SQLite real · pronto</span>':`<span class="chip">${h(loadError||'Carregando SQLite...')}</span>`}
async function initEngine(){try{if(typeof initSqlJs!=='function')throw Error('Não foi possível carregar a biblioteca sql.js. Verifique a conexão com a internet.');SQL=await initSqlJs({locateFile:()=>SQL_WASM});ready=true;loadError=''}catch(ex){ready=false;loadError='SQLite indisponível: conexão necessária para carregar o mecanismo.'}render()}
function setupDB(){const db=new SQL.Database();db.run('CREATE TABLE pedidos(id INTEGER PRIMARY KEY, cliente TEXT, cidade TEXT, valor REAL, status TEXT)');const stmt=db.prepare('INSERT INTO pedidos VALUES(?,?,?,?,?)');for(const x of DATA)stmt.run(x);stmt.free();return db}
function validateReadOnly(q){const clean=q.trim();if(!clean)throw Error('Digite uma consulta antes de executar.');if(/\b(INSERT|UPDATE|DELETE|DROP|ALTER|CREATE|REPLACE|ATTACH|DETACH|PRAGMA|VACUUM|BEGIN|COMMIT|ROLLBACK)\b/i.test(clean.replace(/'([^']|'')*'/g,"''")))throw Error('Nesta aula, usamos apenas consultas de leitura com SELECT.');if(!/^\s*SELECT\b/i.test(clean))throw Error('A consulta deve começar com SELECT.');if((clean.match(/;/g)||[]).length>1||/;\s*\S/.test(clean))throw Error('Execute apenas uma instrução SELECT por vez.');if(/\b(AND|OR|JOIN|UNION|GROUP\s+BY|HAVING)\b/i.test(clean.replace(/'([^']|'')*'/g,"''")))throw Error('Nesta aula, trabalhe com uma condição por consulta, usando SELECT, FROM e WHERE.');if(/\bSELECT\s+FROM\b/i.test(clean))throw Error('Depois de SELECT, informe uma ou mais colunas ou use * para mostrar todas.');if(/\bSELECT\s+\w+\s+\w+\s+FROM\b/i.test(clean)&&!/\bSELECT\s+DISTINCT\b/i.test(clean))throw Error('Verifique a lista de colunas: quando escolher duas colunas, separe os nomes por vírgula.');if(/\bWHERE\s+\w+\s*=\s*"/i.test(clean))throw Error('Para comparar valores textuais nesta aula, utilize aspas simples, como cidade = \'Santos\'.');}
function sqlExecute(q){if(!ready)throw Error('O motor SQLite ainda não foi carregado. Confira sua conexão e recarregue a página.');validateReadOnly(q);const db=setupDB();try{const output=db.exec(q);return output.length?{cols:output[0].columns,rows:output[0].values}: {cols:[],rows:[]}}catch(ex){let s=String(ex.message||ex);if(/no such column: (\w+)/i.test(s))s=`Coluna desconhecida (${s.match(/no such column: (\w+)/i)[1]}). Confira os nomes da tabela: ${COLS.join(', ')}.`;else if(/no such table: (\w+)/i.test(s))s='Tabela não encontrada. Nesta atividade, a tabela disponível chama-se pedidos.';else if(/syntax error/i.test(s))s='Erro de sintaxe do SQLite: '+s+'. Confira a estrutura SELECT colunas FROM pedidos WHERE condição.';throw Error(s)}finally{db.close()}}
function trimmedResult(out){return {cols:out.cols.map(key),rows:out.rows.map(r=>r.map(v=>v===null?null:String(v)))}}
function matchRows(actual,exp){return actual.cols.length===exp.cols.length &&actual.cols.every((c,i)=>key(c)===key(exp.cols[i]))&&JSON.stringify(actual.rows.map(JSON.stringify).sort())===JSON.stringify(exp.rows.map(JSON.stringify).sort())}
function expected(sql){return trimmedResult(sqlExecute(sql))}
function labCheck(out){const q=labLevel===0?'SELECT cliente, status FROM pedidos;':'SELECT cliente, status FROM pedidos WHERE valor > 500;';return matchRows(trimmedResult(out),expected(q)) && (labLevel!==0 || !/\bWHERE\b/i.test(labText))}
function submitLab(){labText=document.getElementById('labSQL').value;try{const o=sqlExecute(labText),s=labCheck(o);labResult={out:o,success:s,msg:s?feedback('Desafio concluído! O resultado corresponde ao enunciado.','ok'):feedback('A consulta é válida, mas ainda não corresponde ao pedido. Compare as colunas e as linhas retornadas.','bad')};if(s&&labLevel===1)done.add(5)}catch(ex){labResult={error:ex.message}}render()}
function advanceLab(){if(!labResult?.success)return;labLevel=1;labText='';labResult=null;labHint=0;render()}
function returnToLabA(){labLevel=0;labText='';labResult=null;render()}
function m5(){const s=labLevel===0;return `<h2>Missão 5 · Laboratório de SQL</h2><p class="lead">Agora escreva sua consulta sem cartões. Você terá dois desafios progressivos.</p><div class="card"><div class="row space"><h3>Desafio ${s?'A':'B'} de 2</h3>${engineStatus()}</div><div class="task"><h3>⌨️ ${s?'Seleção':'Refinamento'}</h3>${s?'<p>Mostre <strong>somente</strong> as colunas <code>cliente</code> e <code>status</code> da tabela <code>pedidos</code>. Não filtre as linhas.</p>':'<p>Agora mostre <strong>somente</strong> as colunas <code>cliente</code> e <code>status</code> dos pedidos cujo valor seja <strong>maior que R$ 500</strong>.</p>'}</div><h3>Base de referência · <code>pedidos</code></h3>${basicTable(DATA)}<label for="labSQL">Digite sua consulta SQL:</label><textarea id="labSQL" spellcheck="false" placeholder="Digite sua consulta..." oninput="labText=this.value">${h(labText)}</textarea><div class="row" style="margin-top:12px"><button class="btn" ${!ready?'disabled':''} onclick="submitLab()">▶ Executar consulta</button><button class="btn alt" onclick="labHint++;render()">💡 Dica</button>${labLevel===1?'<button class="btn alt" onclick="returnToLabA()">← Desafio A</button>':''}</div>${labHint?`<div class="hint">${s?(labHint===1?'Indique os dois nomes de colunas após SELECT.':'Separe os dois nomes por vírgula e indique a tabela após FROM.'):(labHint===1?'Use uma condição numérica no WHERE.':'Você precisa mostrar duas colunas, mas filtrar por uma terceira.')}</div>`:''}${labResult?(labResult.error?feedback(h(labResult.error),'bad'):`<div class="result"><h3>Resultado · ${labResult.out.rows.length} linhas</h3>${resultTable(labResult.out.cols,labResult.out.rows)}${labResult.msg}</div>`):''}${labResult?.success&&s?'<button class="btn next-round" onclick="advanceLab()">Ir para o desafio B →</button>':''}</div><p class="status">As consultas são executadas pelo mecanismo SQLite. Uma instrução SQL pode ser válida, mas não atender ao que foi solicitado.</p>`}
function finalGuidedCheck(out){return matchRows(trimmedResult(out),expected("SELECT id, cliente, valor FROM pedidos WHERE cidade = 'Santos';"))}
function authoredCheck(q,out){const question=authoredQuestion.trim();if(question.length<18)return 'Escreva sua pergunta de investigação com pelo menos 18 caracteres.';if(!/\bWHERE\b/i.test(q))return 'Sua consulta autoral deve usar WHERE para filtrar registros.';if(!/\bFROM\s+pedidos\b/i.test(q))return 'Consulte a tabela pedidos.';if(out.rows.length===0)return 'A consulta não encontrou registros. Experimente uma pergunta que produza um resultado observável.';if(out.rows.length>=DATA.length)return 'A consulta não reduziu os registros. Crie uma pergunta que exija um filtro real.';if(finalGuidedCheck(out))return 'Sua consulta repetiu a investigação anterior. Crie uma busca diferente.';if(/\bWHERE\s+valor\s*>\s*500\b/i.test(q)||/\bWHERE\s+cidade\s*=\s*'Santos'/i.test(q)||/\bWHERE\s+status\s*=\s*'Pendente'/i.test(q))return 'Essa condição já apareceu em um exercício anterior. Escolha outro filtro para sua investigação autoral.';return ''}
function submitFinal(){finalText=document.getElementById('caseSQL').value;if(finalStage===1)authoredQuestion=document.getElementById('authorQuestion').value;try{const o=sqlExecute(finalText);const problem=finalStage===0?(!finalGuidedCheck(o)?'A consulta executou, mas as colunas ou os registros não correspondem à solicitação. Confira o que o relatório pede.':''):authoredCheck(finalText,o);finalResult={out:o,success:!problem,msg:problem?feedback(h(problem),'bad'):feedback(finalStage===0?'Relatório correto! Você encontrou os registros solicitados.':'Consulta autoral executada! Compare o resultado com sua pergunta. A professora verificará essa relação na correção coletiva.','ok')};if(!problem){if(finalStage===0)finalStageA=true;else {finalStageB=true;done.add(6)}}}catch(ex){finalResult={error:ex.message}}render()}
function advanceFinal(){if(!finalStageA)return;finalStage=1;finalText='';finalResult=null;finalHint=0;render()}
function backFinal(){finalStage=0;finalText='';finalResult=null;finalHint=0;render()}
function finalHintAction(){finalHint=Math.min(2,finalHint+1);if(finalStage===1){authoredQuestion=document.getElementById('authorQuestion').value}finalText=document.getElementById('caseSQL').value;render()}
function m6(){const guided=finalStage===0;return `<h2>Missão 6 · Investigação final</h2><p class="lead">Você já conhece os comandos SQL. Agora deverá investigar uma situação e criar sua própria pergunta para o banco.</p><div class="card"><div class="row space"><h3>Etapa ${guided?'A — Investigação guiada':'B — Investigação autoral'}</h3>${engineStatus()}</div><div class="task"><h3>${guided?'🕵️ O pedido sob análise':'✍️ Crie sua própria investigação'}</h3>${guided?'<p>Uma loja precisa conferir os pedidos feitos em <strong>Santos</strong>. Prepare um relatório que mostre <strong>somente as colunas <code>id</code>, <code>cliente</code> e <code>valor</code></strong> desses pedidos. Escreva a consulta completa e execute-a.</p>':'<p>Agora você decide o que investigar. Escreva uma pergunta diferente da anterior sobre a tabela <code>pedidos</code> e crie uma consulta SQL com <code>SELECT</code>, <code>FROM</code> e <code>WHERE</code> que ajude a respondê-la. Utilize um critério diferente dos desafios anteriores. A consulta deverá retornar pelo menos um pedido e filtrar parte da tabela.</p>'}</div><h3>Tabela disponível · <code>pedidos</code></h3>${basicTable(DATA)}${guided?'':`<label for="authorQuestion">Qual pergunta você deseja investigar?</label><textarea id="authorQuestion" style="min-height:85px;font-family:inherit;font-size:19px" placeholder="Escreva sua pergunta sobre os pedidos..." oninput="authoredQuestion=this.value">${h(authoredQuestion)}</textarea>`}<label for="caseSQL">Escreva sua consulta SQL:</label><textarea id="caseSQL" spellcheck="false" placeholder="Digite uma consulta com SELECT, FROM e WHERE..." oninput="finalText=this.value">${h(finalText)}</textarea><div class="row" style="margin-top:14px"><button class="btn" ${!ready?'disabled':''} onclick="submitFinal()">▶ Executar consulta</button><button class="btn alt" onclick="finalHintAction()">💡 Dica</button>${!guided?'<button class="btn alt" onclick="backFinal()">← Etapa A</button>':''}</div>${finalHint?`<div class="hint">${guided?(finalHint===1?'Liste exatamente as colunas pedidas, separadas por vírgulas.':'A condição de filtragem compara a cidade com um valor de texto.'):(finalHint===1?'Experimente uma condição nova sobre cidade, valor, status ou cliente.':'Sua pergunta precisa combinar com a condição usada no WHERE; evite repetir o relatório da etapa A.')}</div>`:''}${finalResult?(finalResult.error?feedback(h(finalResult.error),'bad'):`<div class="result"><h3>Resultado da consulta · ${finalResult.out.rows.length} linhas</h3>${resultTable(finalResult.out.cols,finalResult.out.rows)}${finalResult.msg}</div>`):''}${guided&&finalStageA?'<button class="btn next-round" onclick="advanceFinal()">Avançar para investigação autoral →</button>':''}${!guided&&finalStageB?feedback('As duas etapas foram realizadas. Você pode encerrar e acompanhar a resolução da professora.','ok'):''}</div>`}
function end(){return `<div class="bigcenter"><h1>Investigação concluída!</h1><p class="lead">Você aprendeu a selecionar colunas, consultar tabelas, filtrar registros e analisar resultados usando <code>SELECT</code>, <code>FROM</code> e <code>WHERE</code>.</p><div class="card" style="text-align:left"><h3>O que você aprendeu?</h3><p>Ao longo das missões, você utilizou consultas SQL básicas para encontrar informações e investigar um problema a partir dos dados.</p><h3>Continue aprendendo!</h3><p>Para praticar mais, explore os exercícios interativos do <a href="https://sqlbolt.com/" target="_blank" rel="noopener noreferrer">SQLBolt</a>. Como leitura complementar, conheça o livro <em>Learning SQL</em>, de Alan Beaulieu.</p><p>Nas próximas aulas, aprofundaremos nossos conhecimentos de SQL, explorando novos comandos e outras possibilidades de consulta e manipulação de dados.</p></div><p>Obrigado por participar da investigação!</p></div>`}
function openTeacherModal(){document.getElementById('passwordModal').hidden=false;document.getElementById('passwordModal').innerHTML='<div style="position:fixed;inset:0;background:#06111be8;display:grid;place-items:center;z-index:20"><div class="card" style="width:min(430px,90vw)"><h3>Acesso da professora</h3><label for="pass">Senha</label><input id="pass" type="password" autocomplete="off" style="padding:11px;width:100%;color:#152b31;background:white;border-radius:8px"><div class="row" style="margin-top:15px"><button class="btn" onclick="unlockTeacher()">Entrar</button><button class="btn alt" onclick="closeTeacher()">Cancelar</button></div><div id="passMsg"></div></div></div>';document.getElementById('pass').focus()}
function closeTeacher(){document.getElementById('passwordModal').hidden=true;document.getElementById('passwordModal').innerHTML=''}
function unlockTeacher(){if(document.getElementById('pass').value===PASSWORD){teacher=true;try{sessionStorage.setItem('sql_teacher_new_v1','1')}catch(e){}closeTeacher();render()}else document.getElementById('passMsg').textContent='Senha incorreta.'}
document.addEventListener('keydown',e=>{if(e.altKey&&e.shiftKey&&e.key.toLowerCase()==='p'){e.preventDefault();openTeacherModal()}});
try{teacher=sessionStorage.getItem('sql_teacher_new_v1')==='1'}catch(e){};render();initEngine();
</script></body></html>
